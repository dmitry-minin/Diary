{% extends 'diary/base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-warning text-dark p-4 rounded-3 shadow-lg">
                <div class="text-center mb-4">
                    <h1 class="h3 mb-3 fw-normal">Вход</h1>
                </div>
                <form method="post" class="needs-validation">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                        <div class="invalid-feedback">
                            {{ field.errors.0 }}
                        </div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    <button class="w-100 btn btn-dark text-white" type="submit">Войти</button>
                </form>
                <div class="text-center mt-4">
                    <p class="mb-0">Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться</a></p>
                    <p class="mb-0">Забыли пароль? <a href="{% url 'users:password_reset' %}">Восстановить</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
