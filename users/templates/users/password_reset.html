{% extends 'diary/base.html' %}
{% block title %}Восстановление пароля{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-warning text-dark p-4 rounded-3 shadow-lg">
                <div class="text-center mb-4">
                    <h1 class="h3 mb-3 fw-normal">Восстановление пароля</h1>
                </div>
                <form method="post" class="needs-validation">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="invalid-feedback">
                                    {{ field.errors.0 }}
                                </div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <button class="w-100 btn btn-dark text-white" type="submit">Сбросить пароль</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
