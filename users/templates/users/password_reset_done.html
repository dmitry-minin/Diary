{% extends 'diary/base.html' %}
{% block title %}Письмо отправлено{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-warning text-dark p-4 rounded-3 shadow-lg">
                <div class="text-center mb-4">
                    <h1 class="h3 mb-3 fw-normal">Проверьте почту</h1>
                </div>
                <div class="text-center">
                    <p>Мы отправили вам письмо со ссылкой для сброса пароля.<br>
                    Если письмо не пришло — проверьте папку «Спам».</p>
                    <a href="{% url 'users:login' %}" class="btn btn-dark text-white mt-3">Вернуться ко входу</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
